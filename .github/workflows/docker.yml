# Builds the Docker image of Stereocode with the newest srcML release and the newest Ubuntu packages,
# runs the tests of Stereocode and a small project in the image, and publishes the image of the newest release on GitHub
name: Docker

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The runs that publish wait for each other, since the deletion of the images without a tag would remove the new images of another run
concurrency:
  group: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && 'docker-publish' || format('docker-{0}', github.ref) }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/srcml/stereocode

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.find.outputs.ref }}
      version: ${{ steps.find.outputs.version }}
      srcml: ${{ steps.find.outputs.srcml }}
      newest: ${{ steps.find.outputs.newest }}
      publish: ${{ steps.find.outputs.publish }}
      revision: ${{ steps.find.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Find the source and the srcML release of the image
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          srcml=$(gh api repos/srcML/srcML/releases/latest --jq '.tag_name')
          newest=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          # A release tag, a push to main, the weekly run, and a manual run publish a release, while develop and pull requests only test
          # A push to main whose commit carries a release tag only tests, since the run of the tag publishes that release
          case "$GITHUB_EVENT_NAME/$GITHUB_REF" in
            push/refs/tags/v*)                    ref=$GITHUB_REF_NAME publish=true ;;
            push/refs/heads/main)                 if [ -n "$(git tag --points-at "$GITHUB_SHA" --list 'v*')" ]
                                                  then ref=$GITHUB_SHA publish=false
                                                  else ref=$newest publish=true
                                                  fi ;;
            schedule/*|workflow_dispatch/*)       ref=$newest publish=true ;;
            *)                                    ref=$GITHUB_SHA publish=false ;;
          esac
          {
            echo "ref=$ref"
            echo "version=${ref#v}"
            echo "srcml=${srcml#v}"
            echo "newest=$([ "$ref" = "$newest" ] && echo true || echo false)"
            echo "publish=$publish"
            echo "revision=$(git rev-parse "$ref^{commit}")"
          } | tee -a "$GITHUB_OUTPUT"

  image:
    needs: versions
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Each architecture sets the output of its own name, and the outputs of the matrix combine
    outputs:
      amd64: ${{ steps.build.outputs.amd64 }}
      arm64: ${{ steps.build.outputs.arm64 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.versions.outputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the GitHub Container Registry
        if: needs.versions.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build the image, which runs the tests of Stereocode
        id: build
        env:
          GITHUB_AUTH: 'Authorization: Bearer ${{ github.token }}'
          PUBLISH: ${{ needs.versions.outputs.publish }}
        run: |
          # A run that publishes pushes the image by its digest alone, which the publish joins with the other architecture under the tags
          if [ "$PUBLISH" = true ]; then
            output=(--output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true")
          else
            output=(--load --tag stereocode:test)
          fi
          # Without the provenance record, which GitHub lists as a third platform, unknown/unknown
          docker buildx build --pull --no-cache --provenance=false \
            --build-arg SRCML_VERSION=${{ needs.versions.outputs.srcml }} \
            --secret id=github_auth,env=GITHUB_AUTH \
            --metadata-file "$RUNNER_TEMP/build.json" "${output[@]}" .
          if [ "$PUBLISH" = true ]; then
            digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
            echo "${{ matrix.arch }}=$digest" >> "$GITHUB_OUTPUT"
            echo "TESTED=$IMAGE@$digest" >> "$GITHUB_ENV"
          else
            echo "TESTED=stereocode:test" >> "$GITHUB_ENV"
          fi
      - name: Run the image on a small C++ project
        run: |
          mkdir -p sample/my_project
          printf 'class Point {\n    int x;\npublic:\n    int getX() const { return x; }\n};\n' > sample/my_project/point.cpp
          docker run --rm -v "$PWD/sample:/data" "$TESTED" srcml my_project -o my_project.xml
          docker run --rm -v "$PWD/sample:/data" "$TESTED" stereocode my_project.xml -r
          grep -q 'st:stereotype="get"' sample/my_project.stereotypes.xml
          test -s sample/my_project.stereotypes.csv
          # The entrypoint keeps the owner of the mounted folder as the owner of the output
          test "$(stat -c %u sample/my_project.stereotypes.xml)" = "$(id -u)"
          docker run --rm "$TESTED" stereocode --version

  publish:
    needs: [versions, image]
    if: needs.versions.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Publish the image of both architectures under its tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
          SRCML: ${{ needs.versions.outputs.srcml }}
          NEWEST: ${{ needs.versions.outputs.newest }}
          REVISION: ${{ needs.versions.outputs.revision }}
          AMD64: ${{ needs.image.outputs.amd64 }}
          ARM64: ${{ needs.image.outputs.arm64 }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tags=(--tag "$IMAGE:$VERSION")
          # The tag of a release with one srcML release keeps its first build of the commit of the release, also where the release tag moves
          pinned="$IMAGE:$VERSION-srcml$SRCML"
          built=$(docker buildx imagetools inspect --raw "$pinned" 2>/dev/null | jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true)
          if [ "$built" != "$REVISION" ]; then
            tags+=(--tag "$pinned")
          fi
          if [ "$NEWEST" = true ]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" --annotation "index:org.opencontainers.image.revision=$REVISION" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
      - name: Delete the images that lost their tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/prune_images.py

  keepalive:
    # GitHub stops the schedule of a public repository after 60 days without activity, while enabling it again restarts that count
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Keep the weekly build enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/enable"
